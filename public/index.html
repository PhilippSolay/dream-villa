<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Dream House</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- One nav, two shapes: a floating bottom capsule on a phone (stats + tools in a slim
         row at the top of the page), a fixed left rail on desktop with everything in it. -->
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <a class="logo" href="#/" aria-label="Dream House">
        <!-- The mark: an arch, a rising sun fanning out over terraced fields. Drawn as a gold
             arch with the gaps masked out, so it sits on any background. -->
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="logo-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--gold-2)" />
              <stop offset="1" stop-color="var(--gold)" />
            </linearGradient>
            <mask id="logo-arch">
              <path d="M6 38V20a14 14 0 0 1 28 0v18z" fill="#fff" />
              <g fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round">
                <path d="M20 23.5V6.5M20 23.5l-7.4-14M20 23.5l7.4-14M20 23.5 8.2 13.6M20 23.5l11.8-9.9M20 23.5 6 20.5M20 23.5l14-3" />
                <path d="M6 25.8c8-1.6 15.5 3.2 28-1.4M6 31.2c8.5-2.5 17 3 28-1.6M6 36.4c9-2.4 18 2.4 28-1.8" />
              </g>
            </mask>
          </defs>
          <rect width="40" height="40" fill="url(#logo-gold)" mask="url(#logo-arch)" />
        </svg>
      </a>
      <div class="nav-top">
        <div class="nav-tools">
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
          <div class="account-wrap" id="account-wrap">
            <button type="button" class="user-btn" id="user-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Account">·</button>
            <div class="menu account-menu" id="account-menu" role="menu" hidden></div>
          </div>
        </div>
      </div>
      <div class="tabbar" id="tabbar">
        <a class="tab" href="#/" data-route="home"></a>
        <a class="tab" href="#/shared" data-route="shared"></a>
        <a class="tab" href="#/map" data-route="map"></a>
        <a class="tab" href="#/market" data-route="market"></a>
        <a class="tab" href="#/gone" data-route="gone"></a>
        <a class="tab" href="#/agent" data-route="agent"></a>
        <!-- Owners only (SPEC §17); starts hidden so a friend never sees it flash in. -->
        <a class="tab" href="#/people" data-route="people" hidden></a>
      </div>
    </nav>

    <main class="view" id="view"></main>

    <div class="backdrop" id="backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Filters" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
