<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Dream House</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- One nav, two shapes: a floating bottom capsule on a phone (stats + tools in a slim
         row at the top of the page), a fixed left rail on desktop with everything in it. -->
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <a class="logo" href="#/" aria-label="Dream House">
        <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="logo-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--gold-2)" />
              <stop offset="1" stop-color="var(--gold)" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="13" fill="url(#logo-gold)" />
          <circle cx="27.5" cy="12.5" r="3" fill="#1a1713" opacity="0.85" />
          <path d="M7 24.5c4.5-1.5 7.5-6 13-12 5.5 6 8.5 10.5 13 12" fill="none" stroke="#1a1713" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 30h16" stroke="#1a1713" stroke-width="2.3" stroke-linecap="round" />
        </svg>
      </a>
      <div class="nav-top">
        <div class="nav-stats" id="counts" aria-live="polite"></div>
        <div class="nav-tools">
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
          <button type="button" class="user-btn" id="user-btn" aria-label="Account">·</button>
        </div>
      </div>
      <div class="tabbar" id="tabbar">
        <a class="tab" href="#/" data-route="home"></a>
        <a class="tab" href="#/shared" data-route="shared"></a>
        <a class="tab" href="#/map" data-route="map"></a>
        <a class="tab" href="#/market" data-route="market"></a>
        <a class="tab" href="#/agent" data-route="agent"></a>
      </div>
    </nav>

    <main class="view" id="view"></main>

    <div class="backdrop" id="backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Filters" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
